name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bilazo/kito build
      - run: pnpm --filter @bilazo/kito typecheck
      - run: pnpm --filter @bilazo/kito test
      - run: pnpm lint
      - run: pnpm --filter @bilazo/kito-web build
